name: Sincronizar AUR

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar cambios en upstream Quadra
        id: check_upstream
        run: |
          git clone --filter=blob:none https://github.com/QuadraHQ/Quadra.git upstream
          UPSTREAM_VER=$(git -C upstream describe --tags --long --match 'v[0-9]*' --abbrev=7 | sed 's/^v//;s/^\([0-9][0-9.]*[0-9]\)\.\{0,1\}p\([0-9][0-9]*\)/\1.\2/;s/\([^-]*-g\)/r\1/;s/-/./g')
          echo "Nueva version calculada: $UPSTREAM_VER"
          echo "new_pkgver=$UPSTREAM_VER" >> $GITHUB_OUTPUT

          sed -i "s/^pkgver=.*/pkgver=$UPSTREAM_VER/" PKGBUILD

      - name: Regenerar .SRCINFO en contenedor Arch Linux
        run: |
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:base-devel bash -c "
            pacman -Syu --noconfirm git pacman-contrib > /dev/null 2>&1
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          "
          sudo chown -R $USER:$USER .

      - name: Publicar cambios en AUR
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          rm -rf /tmp/aur_clone
          git clone ssh://aur@aur.archlinux.org/quadrahq-git.git /tmp/aur_clone
          cp PKGBUILD .SRCINFO /tmp/aur_clone/
          cd /tmp/aur_clone
          git config user.name "MapleProjects"
          git config user.email "eportillo898v2@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes para AUR."
          else
            git commit -m "Actualizacion automatica: ${{ steps.check_upstream.outputs.new_pkgver }}"
            git push origin master
            echo "Cambios enviados a AUR correctamente."
          fi

      - name: Actualizar repositorio GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Sin cambios locales en GitHub."
          else
            git commit -m "chore(aur): sincronizar pkgver ${{ steps.check_upstream.outputs.new_pkgver }}"
            git push origin main
          fi
